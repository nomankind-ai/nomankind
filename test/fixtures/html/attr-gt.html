<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Selectors</title></head>
<body>
  <main>
    <h1>Selectors</h1>
    <p data-selector="main > section > p" title="a > b">
      The selector above lives in an attribute and never reaches the text.</p>
    <div class='card' data-tip='use "quotes" > carefully'>
      <p>Attribute values may hold angle brackets.</p>
    </div>
    <p>Text after the tricky attributes.</p>
  </main>
</body>
</html>
