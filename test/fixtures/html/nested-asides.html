    <p>Retry on 429 and on 5xx, with full jitter.</p>
    <aside class="callout">
      <header><h3>Note</h3></header>
      <p>Do not retry a 400; the request is malformed.</p>

      <p>Still inside the outer aside.</p>
    </aside>
    <h2>Backoff</h2>
    <p>Start at 500 ms and double, capped at 30 seconds.</p>
