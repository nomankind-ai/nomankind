<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Widget</title></head>
<body>
  <main>
    <h1>Widget</h1>
    <script>
      // <!-- a comment inside a script -->
      var markup = "</div>";
      if (a < b && b > c) { render(markup); }
    </script>
    <p>The widget renders a price table.</p>
    <!-- an ordinary comment with <p>markup</p> inside it -->
    <p>Comments never reach the extracted text.</p>
  </main>
</body>
