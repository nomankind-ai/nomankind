name: Deploy production

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard the tag
        run: |
          set -euo pipefail
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]; then
            echo "refusing to deploy: $GITHUB_REF_NAME is not an annotated tag"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "refusing to deploy: the tagged commit is not reachable from origin/main"
            exit 1
          fi
          echo "$GITHUB_REF_NAME is an annotated tag on main"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: |
          set -euo pipefail
          url=https://app.nomankind.ai/health
          # 36 attempts, 10 seconds apart: six minutes, enough for the first
          # deploy to wait on custom domain certificate issuance.
          for attempt in $(seq 1 36); do
            # One expression, one value: curl still writes %{http_code} when it
            # fails, and the default covers the case where it writes nothing.
            code=$(curl -sS -o response.json -w '%{http_code}' "$url" || true)
            code=${code:-000}
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              cat response.json
              echo
              if jq -e '.ok == true and .storage == "ok"' response.json >/dev/null; then
                echo "smoke test passed"
                exit 0
              fi
              echo "health body did not report ok"
            fi
            sleep 10
          done
          echo "smoke test failed: $url never answered 200 with ok true and storage ok"
          if [ -f response.json ]; then cat response.json; echo; fi
          exit 1
