name: Deploy demo

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --env demo --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy --env demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: |
          set -euo pipefail
          url=https://demo.nomankind.ai/health
          # 36 attempts, 10 seconds apart: six minutes, enough for the first
          # deploy to wait on custom domain certificate issuance.
          for attempt in $(seq 1 36); do
            # One expression, one value: curl still writes %{http_code} when it
            # fails, and the default covers the case where it writes nothing.
            code=$(curl -sS -o response.json -w '%{http_code}' "$url" || true)
            code=${code:-000}
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              cat response.json
              echo
              if jq -e '.ok == true and .storage == "ok"' response.json >/dev/null; then
                echo "smoke test passed"
                exit 0
              fi
              echo "health body did not report ok"
            fi
            sleep 10
          done
          echo "smoke test failed: $url never answered 200 with ok true and storage ok"
          if [ -f response.json ]; then cat response.json; echo; fi
          exit 1
